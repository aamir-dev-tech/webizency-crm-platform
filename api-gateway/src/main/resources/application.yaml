spring:
  application:
    name: api-gateway

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8090/realms/crm

  cloud:
    gateway:
      server:
        webflux:
          routes:

            - id: user-service
              uri: http://localhost:8081
              predicates:
                - Path=/api/v1/users/**

            - id: team-service
              uri: http://localhost:8081
              predicates:
                - Path=/api/v1/teams/**

            - id: role-service
              uri: http://localhost:8081
              predicates:
                - Path=/api/v1/roles/**

            - id: contact-service
              uri: http://localhost:8082
              predicates:
                - Path=/api/v1/customers/**

server:
  port: 8080

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n"